<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5cab">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{--blue:#0b5cab;--blue-dark:#08427a;--green:#1a7f37;--red:#cf222e;--amber:#9a6700;--gray:#6e7781;--bg:#f4f6f9;--card:#fff;--border:#dde3ea;}
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);margin:0;color:#1f2328;}
  .wrap{max-width:900px;margin:0 auto;padding:18px;}
  h1{font-size:20px;color:var(--blue-dark);margin:8px 0 4px;font-weight:800;}
  .sub{color:var(--gray);font-size:13px;margin-bottom:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  .card h3{margin:0;font-size:15px;color:var(--blue-dark);}
  .meta{font-size:12px;color:var(--gray);margin-top:4px;}
  .grade-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:700;font-size:11px;color:#fff;background:var(--blue);}
  .links a{color:var(--blue);text-decoration:none;font-weight:600;font-size:12.5px;margin-right:14px;}
  .req-btn{background:#374151;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;}
  .req-status{font-size:11.5px;margin-top:6px;color:var(--gray);}
  .empty{color:var(--gray);padding:20px;text-align:center;}
  .top-menu{position:sticky;top:0;left:0;right:0;background:#08427a;z-index:160;display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .top-menu a{display:inline-block;padding:8px 14px;color:#e8f0fb;text-decoration:none;font-size:12.5px;font-weight:600;border-radius:8px;}
  .top-menu a:hover,.top-menu a.active{background:rgba(255,255,255,.15);}
</style>

<script src="api.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed:', e); });
  });
}
</script>
</head>
<body>
<div id="loginGate" style="position:fixed;inset:0;background:linear-gradient(135deg,rgba(8,66,122,.92),rgba(11,92,171,.88));z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#fff;border-radius:18px;padding:0;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;">
    <div style="background:linear-gradient(135deg,#0b5cab,#08427a);padding:32px 24px 26px;">
      <div style="width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px;">📄</div>
      <h2 style="margin:0 0 4px;color:#fff;font-size:19px;font-weight:800;">My Submissions</h2>
      <div style="font-size:12px;color:#c9ddf5;">Login karke apni entries dekhein</div>
    </div>
    <div style="padding:26px 24px 24px;">
      <input type="text" id="loginEmail" placeholder="Consultant ID ya Email" autocomplete="off" style="width:100%;padding:13px 14px;border:1.5px solid #dde3ea;border-radius:10px;font-size:15px;margin-bottom:12px;box-sizing:border-box;" onfocus="this.style.borderColor='#0b5cab'" onblur="this.style.borderColor='#dde3ea'">
      <div id="loginError" style="color:#cf222e;font-size:12px;margin-bottom:10px;min-height:16px;"></div>
      <button onclick="doLogin_()" style="width:100%;padding:14px;background:linear-gradient(135deg,#0b5cab,#08427a);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(11,92,171,.35);">Login &amp; Continue →</button>
    </div>
  </div>
</div>

<div class="top-menu" id="sideMenu">
  <a href="index.html">📋 Form Entry</a>
  <a href="mysubmissions.html">📄 My Submissions</a>
  <a href="#" onclick="logout_();return false;" style="color:#ffb4b4;">🚪 Logout</a>
</div>

<div class="wrap">
  <h1 id="pageTitle">📄 My Submissions</h1>
  <div class="sub" id="pageSub">Sirf aapke khud ke submissions yahan dikhte hain</div>
  <div id="pendingSummary" style="display:none;"></div>
  <div id="list"><div class="empty">Loading...</div></div>
</div>

<script>
var WEB_APP_URL = "index.html";
function toggleMenu_() { /* no-op — menu is now a top bar, always visible */ }

var myLoginId = '';
var myOfficerName = '';
var myIsAdmin = false;

// ---------------------------------------------------------------------
// SESSION — login once, stays logged in across pages for 12 hours.
// ---------------------------------------------------------------------
var SESSION_KEY = 'cfl_session_v1';
var SESSION_HOURS = 12;
function loadSession_() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (Date.now() - data.ts > SESSION_HOURS * 3600000) { localStorage.removeItem(SESSION_KEY); return null; }
    return data;
  } catch (e) { return null; }
}
function saveSession_(data) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ email: data.email, isAdmin: !!data.isAdmin, officerName: data.officerName || '', ts: Date.now() })); }
  catch (e) {}
}
function logout_() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  if (WEB_APP_URL) { window.top.location.href = 'mysubmissions.html?_r=' + Date.now(); }
  else { location.reload(); }
}
function tryResumeSession_() {
  var sess = loadSession_();
  if (!sess) return false;
  myLoginId = sess.email;
  myOfficerName = sess.officerName || '';
  myIsAdmin = !!sess.isAdmin;
  document.getElementById('loginGate').style.display = 'none';
  loadSubmissions_();
  return true;
}
tryResumeSession_();

function doLogin_() {
  var consultantId = document.getElementById('loginEmail').value.trim();
  var errEl = document.getElementById('loginError');
  if (!consultantId) { errEl.textContent = 'Apna Consultant ID daalein.'; return; }
  errEl.style.color = '#6e7781';
  errEl.textContent = 'Verify ho raha hai...';
  google.script.run.withSuccessHandler(function (res) {
    if (!res || !res.ok) {
      errEl.style.color = '#cf222e';
      errEl.textContent = 'Ye Consultant ID registered nahi hai.';
      return;
    }
    myLoginId = consultantId;
    myOfficerName = res.name || '';
    myIsAdmin = !!res.isAdmin;
    saveSession_({ email: consultantId, isAdmin: !!res.isAdmin, officerName: res.name || '' });
    document.getElementById('loginGate').style.display = 'none';
    loadSubmissions_();
  }).withFailureHandler(function (err) {
    errEl.style.color = '#cf222e';
    errEl.textContent = 'Error: ' + (err.message || err);
  }).checkLoginConsultantId(consultantId);
}

function renderPendingSummary_(list) {
  var el = document.getElementById('pendingSummary');
  if (!list || !list.length) { el.style.display = 'none'; return; }

  var totalRed = 0, totalPending = 0, totalGreen = 0;
  var cflsNeedingFollowUp = {};
  list.forEach(function (s) {
    totalRed += s.tatRed || 0;
    totalPending += s.tatPending || 0;
    totalGreen += s.tatGreen || 0;
    if ((s.tatRed || 0) > 0 || (s.tatPending || 0) > 0) {
      cflsNeedingFollowUp[s.cflName] = (cflsNeedingFollowUp[s.cflName] || 0) + (s.tatRed || 0) + (s.tatPending || 0);
    }
  });

  if (totalRed === 0 && totalPending === 0) {
    el.style.display = 'none';
    return;
  }

  var cflListHtml = Object.keys(cflsNeedingFollowUp).slice(0, 6).map(function (name) {
    return '<span style="display:inline-block;background:#fff;border:1px solid #f0c766;border-radius:6px;padding:3px 9px;margin:3px 4px 0 0;font-size:11.5px;">' +
      esc_(name) + ' (' + cflsNeedingFollowUp[name] + ')</span>';
  }).join('');

  el.style.display = 'block';
  el.style.cssText = 'display:block;background:#fff8e1;border:1px solid #f0c766;border-radius:10px;padding:14px 16px;margin-bottom:16px;';
  el.innerHTML =
    '<div style="font-weight:800;color:#7a5b00;font-size:14px;margin-bottom:8px;">⚠️ Aapke Pending Follow-ups (Next Meeting ke liye)</div>' +
    '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;">' +
      '<div><b style="color:#cf222e;font-size:18px;">' + totalRed + '</b> <span style="font-size:12px;color:#6e7781;">Red (overdue)</span></div>' +
      '<div><b style="color:#9a6700;font-size:18px;">' + totalPending + '</b> <span style="font-size:12px;color:#6e7781;">Pending (deadline ke andar)</span></div>' +
      '<div><b style="color:#1a7f37;font-size:18px;">' + totalGreen + '</b> <span style="font-size:12px;color:#6e7781;">Green (complete)</span></div>' +
    '</div>' +
    (cflListHtml ? '<div style="font-size:11.5px;color:#7a5b00;margin-bottom:4px;">CFLs jinme follow-up baaki hai:</div><div>' + cflListHtml + '</div>' : '');
}

function loadSubmissions_() {
  if (myIsAdmin) {
    document.getElementById('pageTitle').textContent = '📄 All Submissions (Admin View)';
    document.getElementById('pageSub').textContent = 'Sabhi Area Managers ke submissions yahan dikhte hain';
  }
  google.script.run.withSuccessHandler(renderList_).withFailureHandler(function (err) {
    document.getElementById('list').innerHTML = '<div class="empty">Error: ' + (err.message || err) + '</div>';
  }).getMySubmissions(myOfficerName, myIsAdmin);
}

function renderList_(list) {
  renderPendingSummary_(list);
  var el = document.getElementById('list');
  if (!list || !list.length) { el.innerHTML = '<div class="empty">Abhi tak koi submission nahi hai.</div>'; return; }
  el.innerHTML = '';
  list.forEach(function (s, i) {
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<div class="top"><div><h3>' + esc_(s.cflName) + ' — ' + esc_(s.reportType) + '</h3>' +
      '<div class="meta">' + (myIsAdmin ? 'Officer: <b>' + esc_(s.officerName) + '</b> · ' : '') +
      'Visit Date: ' + esc_(s.visitDate) + ' · Score: ' + s.scorePct + '% · Grade <span class="grade-pill">' + esc_(s.grade) + '</span></div></div>' +
      '<button class="req-btn" data-idx="' + i + '">✏️ Request Edit</button></div>' +
      '<div class="links" style="margin-top:8px;">' +
      (s.pdfLink ? '<a href="' + s.pdfLink + '" target="_blank">PDF</a>' : '') +
      (s.excelLink ? '<a href="' + s.excelLink + '" target="_blank">Excel</a>' : '') + '</div>' +
      '<div class="req-status" id="reqstatus' + i + '"></div>';
    el.appendChild(div);
  });
  el.querySelectorAll('.req-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = btn.getAttribute('data-idx');
      var s = list[idx];
      var reason = prompt('Kya edit karna hai, chhote me batayein (admin ko dikhega):');
      if (reason === null) return;
      var statusEl = document.getElementById('reqstatus' + idx);
      statusEl.textContent = 'Bhej rahe hain...';
      google.script.run.withSuccessHandler(function (res) {
        statusEl.style.color = '#1a7f37';
        statusEl.textContent = '✅ Request bhej di gayi (' + res.requestId + '). Admin approve karega.';
      }).withFailureHandler(function (err) {
        statusEl.style.color = '#cf222e';
        statusEl.textContent = 'Error: ' + (err.message || err);
      }).requestEditPermission(s.submissionId, s.reportType, reason, myLoginId);
    });
  });
}

function esc_(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
